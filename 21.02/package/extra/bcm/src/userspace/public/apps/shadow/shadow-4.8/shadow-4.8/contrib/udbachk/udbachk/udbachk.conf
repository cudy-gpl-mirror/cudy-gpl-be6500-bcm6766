# Paths to files. These make the same thing as the command line switches.
# Note: command line parameter paths override these specifications.
PATH_TO_PASSWD	#/etc/passwd  # For example
PATH_TO_GROUP
PATH_TO_SHADOW
PATH_TO_GSHADOW

# Modes for files. Note: this is not an umask. If you put either 8 or 9 into
# permission that (ugo) field will not be checked and the permissions will
# be converted to zero.
MODE_FOR_PASSWD	  644
MODE_FOR_GROUP	  644
MODE_FOR_SHADOW	  400
MODE_FOR_GSHADOW  400

# Longest possible login and group names which do not cause a warning.
LONGEST_LOGIN_NAME  8
LONGEST_GROUP_NAME 24

# Minimum and maximum limits of uids and gids. For some unknown reason 65534
# is biggest number which does not get mixed up. Note: you can actually use
# negative uids and gids but I (program author) don't think that is wise.
MIN_UID     0
MAX_UID 65534
MIN_GID     0
MAX_GID 65534

# EOF
